name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  database:
    name: Database + build (migrations, RLS, seat holds, next build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (minimal services)
        run: pnpm supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,supavisor,mailpit,postgres-meta
      - name: Reset from migrations + seed
        run: pnpm db:reset
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      - run: pnpm test:db
      # Tour pages prerender with their departures, so e2e data goes in first.
      - name: E2E data
        run: pnpm e2e:prepare
      # Pages prerender from the database, so the build runs against the
      # freshly seeded local stack (anon key only; no production secrets).
      - name: Build against local Supabase
        run: |
          eval "$(pnpm --silent supabase status -o env | grep -E '^(API_URL|ANON_KEY)=')"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          NEXT_PUBLIC_SITE_URL=http://localhost:3000 pnpm build
      - name: URL crawl (legacy redirects, sitemap, real 404s)
        run: |
          pnpm start -p 3100 > /tmp/next-crawl.log 2>&1 &
          server=$!
          npx --yes wait-on@8.0.3 --timeout 60000 http://localhost:3100/health
          pnpm check:urls --base http://localhost:3100 --allow-missing-content
          kill "$server" || true
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (booking, forms, admin, axe, layout, CSP)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
