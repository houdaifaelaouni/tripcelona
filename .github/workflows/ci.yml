name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
        env:
          # Build needs no secrets; public placeholders keep env reads happy.
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  database:
    name: Database (migrations, RLS, seat holds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase (minimal services)
        run: pnpm supabase start -x studio,imgproxy,vector,logflare,edge-runtime,realtime,supavisor,mailpit,postgres-meta
      - name: Reset from migrations + seed
        run: pnpm db:reset
      - name: Generated types are up to date
        run: |
          pnpm db:types
          git diff --exit-code -- src/lib/supabase/database.types.ts
      - run: pnpm test:db
