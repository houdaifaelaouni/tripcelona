name: Lighthouse

# Runs against each successful Vercel preview deployment.
on:
  deployment_status:

jobs:
  lighthouse:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse budgets (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}/
            ${{ github.event.deployment_status.target_url }}/ofertas-de-viajes
            ${{ github.event.deployment_status.target_url }}/excursiones/la-magia-rural-de-cataluna-escapada-a-rupit-y-tavertet
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
